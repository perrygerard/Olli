<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Mine open-landscape -- playable, real thread</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
  /* Phone frame on wide screens (same technique index.html uses) -- capped
     at 400x844 and centred with a dark bezel, so this previews at mobile
     size in a normal desktop browser with no dev tools/extension needed.
     On a real phone (or a narrow window) the media query below drops the
     frame and lets it fill the viewport edge-to-edge instead. */
  body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;}
  .device{position:relative;width:min(400px,100%);height:min(844px,100dvh);
    background:#0d1117;border-radius:44px;overflow:hidden;
    box-shadow:0 0 0 2px #1e2c31,0 0 0 12px #060b0d,0 40px 90px -30px rgba(0,0,0,.6);}
  @media (max-width:440px){
    body{padding:0;}
    .device{width:100%;height:100dvh;border-radius:0;box-shadow:none;}
  }
  #wrap{position:relative;width:100%;height:100%;}
  canvas{display:block;touch-action:none;cursor:grab;}
  canvas.dragging{cursor:grabbing;}
  #hud{position:absolute;top:12px;left:12px;display:flex;gap:8px;align-items:center;
    background:rgba(20,24,20,.72);backdrop-filter:blur(6px);padding:10px 12px;border-radius:12px;
    color:#eaf3e6;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3);}
  #hud button{border:0;background:#4f9a52;color:#fff;font:inherit;font-weight:600;font-size:13px;
    padding:8px 12px;border-radius:8px;cursor:pointer;}
  #hud button:hover{background:#5cae5f;}
  #hud button.ghost{background:rgba(255,255,255,.12);}
  #hud button.ghost:hover{background:rgba(255,255,255,.2);}
  #hud .lvl{display:flex;align-items:center;gap:4px;}
  #hud .lvl button{padding:6px 9px;}
  #info{min-width:160px;line-height:1.5;}
  #info b{color:#ffe08a;}
  #hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#eaf3e6;font-size:13px;
    background:rgba(20,24,20,.62);padding:7px 14px;border-radius:9px;text-align:center;
    box-shadow:0 4px 16px rgba(0,0,0,.3);}
  #hud2{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;
    background:rgba(20,24,20,.72);backdrop-filter:blur(6px);padding:10px 12px;border-radius:12px;
    color:#eaf3e6;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);width:170px;}
  #hud2 .label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#9fb397;margin-bottom:2px;}
  .lightRow{display:flex;align-items:center;gap:8px;}
  .lightRow input{flex:1;}

  #dpad{position:absolute;right:16px;bottom:16px;display:grid;grid-template-columns:52px 52px 52px;
    grid-template-rows:52px 52px 52px;gap:6px;user-select:none;}
  #dpad button{border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#eaf3e6;
    font-size:20px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3);}
  #dpad button:hover{background:rgba(255,255,255,.22);}
  #dpad button:active{background:#ffb84f;color:#241704;}
  #dpad .empty{background:transparent;box-shadow:none;pointer-events:none;}
  #dpad .center{background:rgba(255,255,255,.06);box-shadow:none;pointer-events:none;font-size:14px;}

  #winPanel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(8,10,8,0);pointer-events:none;transition:background .35s ease;}
  #winPanel.show{background:rgba(8,10,8,.55);pointer-events:auto;}
  #winCard{background:#1a2117;border-radius:16px;padding:26px 30px;text-align:center;color:#eaf3e6;
    box-shadow:0 10px 40px rgba(0,0,0,.5);transform:scale(.85);opacity:0;transition:transform .35s cubic-bezier(.2,.9,.3,1.3),opacity .3s ease;}
  #winPanel.show #winCard{transform:scale(1);opacity:1;}
  #winCard h2{margin:0 0 6px;font-size:22px;color:#ffce6b;}
  #winCard p{margin:0 0 18px;font-size:13px;color:#c9d6c4;}
  #winCard .row{display:flex;gap:10px;justify-content:center;}
  #winCard button{border:0;background:#4f9a52;color:#fff;font:inherit;font-weight:600;font-size:13px;
    padding:9px 16px;border-radius:9px;cursor:pointer;}
  #winCard button:hover{background:#5cae5f;}
  #winCard button.ghost{background:rgba(255,255,255,.14);}
  #winCard button.ghost:hover{background:rgba(255,255,255,.22);}
</style>
</head>
<body>
<div class="device">
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <button id="newSeed">New layout</button>
    <div class="lvl">
      <button id="lvlDown" class="ghost">&minus;</button>
      <span id="lvlLabel">level 6</span>
      <button id="lvlUp" class="ghost">&plus;</button>
    </div>
    <div id="info"></div>
  </div>
  <div id="hud2">
    <div class="label">Light radius</div>
    <div class="lightRow">
      <input type="range" id="lightRange" min="2" max="9" step="0.5" value="4.5" />
      <span id="lightVal">4.5</span>
    </div>
  </div>
  <div id="dpad">
    <div class="empty"></div><button id="dU">&uarr;</button><div class="empty"></div>
    <button id="dL">&larr;</button><div class="center">&#9679;</div><button id="dR">&rarr;</button>
    <div class="empty"></div><button id="dD">&darr;</button><div class="empty"></div>
  </div>
  <div id="hint">drag or tap to extend the thread &middot; retrace to undo &middot; WASD / pad also work</div>
  <div id="winPanel">
    <div id="winCard">
      <h2>You reached the light</h2>
      <p id="winStat">45 steps</p>
      <div class="row">
        <button id="winReplay">Replay layout</button>
        <button id="winNew" class="ghost">New layout</button>
      </div>
    </div>
  </div>
</div>
</div>
<script>
(function(){
  "use strict";
  // ---------------------------------------------------------------------
  // Standalone throwaway mockup -- NOT part of index.html. Corrects course
  // from v4: the user clarified they want this to function like TODAY'S
  // actual maze -- real corridors and dead ends -- not a single guided
  // route. Ported faithfully from index.html's real navigation model:
  //   - `trail` (ordered array of committed cells) + `inTrail` (Set) --
  //     the same structure applyStep/bfsPath/chooseTip use for real.
  //   - A step either ADVANCES (into an open neighbour not yet in the
  //     trail) or RETREATS (steps back onto the immediately-previous
  //     trail cell, popping the tail) -- ported from applyStep(). You
  //     cannot jump to an arbitrary earlier point on your own thread by
  //     walking sideways into it; only exact backward retracing undoes it.
  //   - Tap-to-walk ported from bfsPath(): routes only through already
  //     REVEALED ground (no tapping through fog) and never crosses the
  //     existing thread except by retracing directly onto it.
  //   - Drag-to-walk ported from chooseTip(): candidate directions are
  //     "advance into new ground" or "retreat to the previous cell", same
  //     restriction as keyboard/tap, scored by pointer alignment.
  //   - The actual walked route is now drawn as a real thread -- a soft
  //     dark halo + thin amber core stroked through the trail's cell
  //     centres, the same TRAIL_HALO/TRAIL_THREAD technique and colours
  //     every world in index.html already uses -- so unlike v2-v4, there
  //     is always a continuous, visible line showing exactly where you've
  //     been, independent of the fog reveal.
  // Every closed maze edge (not just ones touching a single route) is
  // dressed with rock/tree boundary decoration again, since the whole
  // maze is real, walkable corridor now -- matching today's game, where
  // every non-open edge gets a wall.
  // ---------------------------------------------------------------------

  const TOTAL = 15;
  function levelParams(i){
    const d = TOTAL > 1 ? i/(TOTAL-1) : 0;
    // map dimensions back to the original scale -- per feedback, "bigger" was
    // meant as bigger TILES (see TILE below), not a bigger map.
    return {
      cols: Math.round(11 + d*17),
      rows: Math.round(15 + d*23),
      braid: 0.05 + d*0.18,
    };
  }

  // ---- maze generation (ported from index.html's genMaze/pickExit) ----
  function genMaze(cols, rows, braid, rng){
    const idx = (c,r)=>r*cols+c;
    const cells = Array.from({length:cols*rows}, ()=>({walls:[true,true,true,true], v:false}));
    const stack = [];
    let cur = idx(0,0); cells[cur].v = true;
    const dirs = [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];
    let count = 1;
    while (count < cols*rows){
      const c = cur % cols, r = (cur/cols)|0;
      const nbrs = [];
      for (const [dc,dr,w,ow] of dirs){
        const nc=c+dc, nr=r+dr;
        if (nc>=0&&nc<cols&&nr>=0&&nr<rows && !cells[idx(nc,nr)].v) nbrs.push([idx(nc,nr),w,ow]);
      }
      if (nbrs.length){
        const [ni,w,ow] = nbrs[(rng()*nbrs.length)|0];
        cells[cur].walls[w]=false; cells[ni].walls[ow]=false;
        stack.push(cur); cur=ni; cells[cur].v=true; count++;
      } else cur = stack.pop();
    }
    if (braid > 0){
      const closed = [];
      for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
        const i = idx(c,r);
        if (c<cols-1 && cells[i].walls[1]) closed.push([i, idx(c+1,r), 1, 3]);
        if (r<rows-1 && cells[i].walls[2]) closed.push([i, idx(c,r+1), 2, 0]);
      }
      for (let k=closed.length-1;k>0;k--){ const j=(rng()*(k+1))|0; [closed[k],closed[j]]=[closed[j],closed[k]]; }
      const openCount = Math.floor(closed.length*braid);
      for (let k=0;k<openCount;k++){ const [a,b,w,ow]=closed[k]; cells[a].walls[w]=false; cells[b].walls[ow]=false; }
    }
    return cells;
  }
  function openNeighbors(cells, cols, rows, i){
    const c = i%cols, r = (i/cols)|0, w = cells[i].walls, out=[];
    if (!w[0] && r>0) out.push(i-cols);
    if (!w[1] && c<cols-1) out.push(i+1);
    if (!w[2] && r<rows-1) out.push(i+cols);
    if (!w[3] && c>0) out.push(i-1);
    return out;
  }
  function bfsDist(cells, cols, rows, start){
    const d = new Int32Array(cols*rows).fill(-1);
    d[start]=0; const q=[start];
    for (let qi=0; qi<q.length; qi++){
      const i=q[qi];
      for (const n of openNeighbors(cells,cols,rows,i)) if (d[n]<0){ d[n]=d[i]+1; q.push(n); }
    }
    return d;
  }
  function pickExit(cells, cols, rows, start, rng){
    const d = bfsDist(cells,cols,rows,start);
    const maxD = Math.max(...d);
    const thresh = maxD*0.7;
    const far = [];
    for (let i=0;i<cols*rows;i++) if (i!==start && d[i]>=thresh) far.push(i);
    return far.length ? far[(rng()*far.length)|0] : cols*rows-1;
  }
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash01(a,b,o){
    const n = Math.sin(a*12.9898 + b*78.233 + o*4.7) * 43758.5453;
    return n - Math.floor(n);
  }

  // ---- colours (toon style: flat fills + black outlines everywhere) ----
  function shade(hex, f){
    const h = hex.replace('#','');
    let r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
    if (f>=0){ r+=(255-r)*f; g+=(255-g)*f; b+=(255-b)*f; } else { r*=1+f; g*=1+f; b*=1+f; }
    r=Math.max(0,Math.min(255,r|0)); g=Math.max(0,Math.min(255,g|0)); b=Math.max(0,Math.min(255,b|0));
    return `rgb(${r},${g},${b})`;
  }
  const GRASS_TOP='#89CF79';
  const PATH_FILL='#FFD29E', PATH_SPECKLE='#8c5c33';
  const START_COL='#5ec548', END_COL='#ff2828';
  const PLAYER_COL='#fff2c8', PLAYER_GLOW='#ffb84f';
  // same thread colours every world in index.html uses
  const TRAIL_THREAD = '#ffc06a', TRAIL_HALO = 'rgba(0,0,0,0.35)';
  // the revealed area reads as a rounded island floating in water -- three
  // concentric bands (dark green, path-tan, pale blue) ring the grass,
  // widest to narrowest, over a deeper "water" background fill.
  const DARK_GREEN = shade(GRASS_TOP, -0.32);
  const ISLAND_BLUE = '#CDEBF7';
  const WATER_BG = '#7FB6E6';

  // ---- iso metrics (tilted up per feedback -- flatter footprint, shorter cliffs) ----
  // TILE is now adaptive rather than a fixed 96px: the whole game now renders
  // inside a phone-frame div (see .device in the CSS) capped at ~400px wide
  // instead of the full browser window, and a tile size tuned for a full
  // desktop window reads as way too zoomed-in at phone width. computeTileMetrics()
  // (called from resize(), below) re-derives these from the frame's own
  // width every time it changes, aiming for ~5 tiles comfortably across.
  let TILE = 96, W_ = TILE/2, H_ = TILE*0.95/2, HZ = TILE*0.30;
  const HEIGHT = 2.0;
  function computeTileMetrics(){
    TILE = Math.max(60, Math.min(96, Math.round(viewW / 5.2)));
    W_ = TILE/2; H_ = TILE*0.95/2; HZ = TILE*0.30;
  }

  const wrap = document.getElementById('wrap');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let dpr = Math.max(1, window.devicePixelRatio || 1);
  // CSS-pixel size of the game's own container (the phone frame's content
  // box), NOT window.innerWidth/innerHeight -- the frame is normally much
  // smaller than the browser window, so anything sized off the window would
  // massively overshoot the frame. Set for real by resize() before first use.
  let viewW = 400, viewH = 844;

  // ---- decoration sprites, supplied as SVGs -- loaded as images and drawn

  // anchor" fraction, so drawImage() lands the sprite's feet exactly at the
  // (x,y) the caller passes in, regardless of the source SVG's own layout.

<path d="M41.6248 76.1932C41.6248 78.9547 35.3567 81.1932 27.6248 81.1932C19.8928 81.1932 13.6248 78.9547 13.6248 76.1932C13.6248 73.4318 19.8928 71.1932 27.6248 71.1932C35.3567 71.1932 41.6248 73.4318 41.6248 76.1932Z" fill="black" fill-opacity="0.2"/>

    if (sinceBump >= 0 && sinceBump < 220){
      const k = 1 - sinceBump/220;
      jx = Math.sin(sinceBump*0.11)*TILE*0.12*k;
    }
    const bob = Math.sin(now/220)*TILE*0.065;
    const cx = x+jx, cy = y-HZ*0.75+jy+bob;
    ctx.fillStyle = 'rgba(255,184,79,.28)';
    ctx.beginPath(); ctx.ellipse(cx,cy,TILE*0.38,TILE*0.38,0,0,7); ctx.fill();
    ctx.fillStyle = shade(PLAYER_GLOW,-0.1);
    ctx.beginPath(); ctx.ellipse(x+jx,y-HZ*0.15,TILE*0.235,TILE*0.132,0,0,7); ctx.fill();
    ctx.fillStyle = PLAYER_COL;
    ctx.beginPath(); ctx.ellipse(cx,cy,TILE*0.19,TILE*0.19,0,0,7); ctx.fill();
    ctx.fillStyle = sinceBump>=0 && sinceBump<220 ? '#ff5b5b' : PLAYER_GLOW;
    ctx.beginPath(); ctx.ellipse(cx,cy,TILE*0.19,TILE*0.19,0,0,7); ctx.globalAlpha=0.5; ctx.fill(); ctx.globalAlpha=1;
  }
  function tapPing(x,y,now){
    if (pingAt < 0) return;
    const t = (now-pingAt)/420;
    if (t > 1) return;
    ctx.strokeStyle = `rgba(255,242,200,${1-t})`;
    ctx.lineWidth = TILE*0.06;
    ctx.beginPath(); ctx.ellipse(x, y-HZ*0.5, W_*0.55*(0.3+t*0.9), H_*0.55*(0.3+t*0.9), 0, 0, 7); ctx.stroke();
  }
  // the thread itself: soft dark halo + thin amber core through every committed cell,
  // plus the live in-progress step -- same two-pass stroke technique as index.html's
  // strokeTrail(), just fed screen points from our iso project() instead of a flat grid.
  function drawThread(now){
    const pts = trail.map(i => { const gx=i%level.cols, gy=(i/level.cols)|0; const [x,y]=project(gx,gy,HEIGHT); return {x, y:y-HZ*0.75}; });
    if (moving){
      const [fx,fy] = playerFloatPos(now);
      const [x,y] = project(fx,fy,HEIGHT);
      pts.push({x, y:y-HZ*0.75});
    }
    if (pts.length < 2) return;
    const strokeOnce = ()=>{
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i=1;i<pts.length-1;i++){
        const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
      }
      ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
      ctx.stroke();
    };
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle = TRAIL_HALO; ctx.lineWidth = TILE*0.22; strokeOnce();
    ctx.strokeStyle = TRAIL_THREAD; ctx.lineWidth = TILE*0.08; strokeOnce();
  }

  function draw(now){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = WATER_BG;
    ctx.fillRect(0,0,viewW,viewH);
    if (!level.cols) return;

    const [pgx,pgy] = playerFloatPos(now);
    const {cols, rows, cells} = level;

    // visible + revealed real cells this frame (fog-gated exactly as before,
    // just against the real cell grid now instead of the doubled render grid)
    const visCells = [];
    for (let gy=0; gy<rows; gy++) for (let gx=0; gx<cols; gx++){
      const [sx,sy] = project(gx,gy,HEIGHT);
      if (sx < -TILE*2 || sx > viewW+TILE*2 || sy < -TILE*6 || sy > viewH+TILE*4) continue;
      if (brightnessOf(gx,gy,pgx,pgy) <= 0.02) continue;
      visCells.push([gx,gy]);
    }
    const visSet = new Set(visCells.map(([gx,gy])=>gy*cols+gx));

    // island: the revealed area reads as a rounded island floating in water.
    // One path unions every visible cell's diamond footprint (canvas fills
    // overlapping sub-paths as a single silhouette under the default nonzero
    // winding rule, so adjoining cells fuse with no per-tile seam); stroking
    // that same silhouette with a big round-jointed outline dilates it
    // outward uniformly, and round joins smooth the diamond grid's zigzag
    // boundary into soft rounded corners "for free" -- no custom boundary-
    // tracing/corner-rounding math needed. Painting four bands largest to
    // smallest (pale blue, path-tan, dark green, grass) leaves each earlier
    // colour showing as a ring around the next. Since it's rebuilt from
    // visCells every frame, the island visibly grows as fog reveals more
    // cells -- exactly the "expands as you explore" look.
    function islandCorePath(cellList){
      ctx.beginPath();
      for (const [gx,gy] of cellList){
        const [x,y] = project(gx,gy,HEIGHT);
        const w=W_*1.02, h=H_*1.02;
        ctx.moveTo(x,y-h); ctx.lineTo(x+w,y); ctx.lineTo(x,y+h); ctx.lineTo(x-w,y); ctx.closePath();
      }
    }
    function paintIslandBand(cellList, growPx, color){
      islandCorePath(cellList);
      ctx.fillStyle = color; ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = growPx;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.stroke();
    }
    // band widths (lineWidth = 2x dilation radius): each needs a radius on
    // the order of a tile or more to fully round out the diamond grid's own
    // zigzag boundary -- verified in a Python/PIL prototype first, since a
    // radius too small (originally tried TILE*0.18/0.75) only rounded the
    // outer bands and left the inner grass/dark-green edge visibly jagged.
    // Dark green's own visible ring width is (1.4-1.1)/2 = 0.15*TILE, half
    // of the original (1.7-1.1)/2 = 0.30*TILE -- grass and the tan band
    // outside it are untouched, so only the green ring got thinner.
    paintIslandBand(visCells, TILE*3.2, ISLAND_BLUE);
    paintIslandBand(visCells, TILE*2.4, PATH_FILL);
    paintIslandBand(visCells, TILE*1.4, DARK_GREEN);
    paintIslandBand(visCells, TILE*1.1, GRASS_TOP);
    // small grass-blade and flower sprites, scattered sparsely across the green
    // (same density/offset hashing the old black tick marks used, just drawing
    // the supplied SVG sprites instead)
    for (const [gx,gy] of visCells){
      if (hash01(gx,gy,41) >= 0.35) continue;
      const ox = (hash01(gx,gy,43)-0.5)*0.7, oy = (hash01(gx,gy,47)-0.5)*0.7;
      const [x,y] = project(gx+ox, gy+oy, HEIGHT);
      const k = 0.8 + hash01(gx,gy,59)*0.4;
      if (hash01(gx,gy,57) < 0.82) grassBladeAt(x,y,k); else flowerAt(x,y,k);
    }

    // path: one continuous stroked network through open-edge cell centres,
    // not a mosaic of tiles -- round line caps give rounded corners and dead
    // ends, and overlapping caps merge smoothly at junctions, all "for free"
    // from the canvas stroke API.
    const segs = [];
    const touched = new Set();
    for (const [gx,gy] of visCells){
      const i = gy*cols+gx;
      if (gx<cols-1 && !cells[i].walls[1] && visSet.has(i+1)){ segs.push([gx,gy,gx+1,gy]); touched.add(i); touched.add(i+1); }
      if (gy<rows-1 && !cells[i].walls[2] && visSet.has(i+cols)){ segs.push([gx,gy,gx,gy+1]); touched.add(i); touched.add(i+cols); }
    }
    const PATH_W = W_*0.5;
    function strokeSegs(width, col){
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      for (const [ax,ay,bx,by] of segs){
        const [sx,sy] = project(ax,ay,HEIGHT), [ex,ey] = project(bx,by,HEIGHT);
        ctx.moveTo(sx,sy); ctx.lineTo(ex,ey);
      }
      ctx.stroke();
      const r = width/2;
      for (const [gx,gy] of visCells){   // safety dot for a revealed cell with no rendered segment
        if (touched.has(gy*cols+gx)) continue;
        const [x,y] = project(gx,gy,HEIGHT);
        ctx.beginPath(); ctx.ellipse(x,y,r,r,0,0,7); ctx.fill();
      }
    }
    strokeSegs(PATH_W, PATH_FILL);

    // speckle dots along the path -- seeded from stable grid-space position
    // (not screen pixels), so the pattern doesn't swim as the camera pans
    for (const [ax,ay,bx,by] of segs){
      const [sx,sy] = project(ax,ay,HEIGHT), [ex,ey] = project(bx,by,HEIGHT);
      for (let k=0;k<3;k++){
        const t = (k+0.5)/3;
        const gx = ax+(bx-ax)*t, gy = ay+(by-ay)*t;
        if (hash01(gx*6.1, gy*6.1, k) >= 0.4) continue;
        const px = sx+(ex-sx)*t, py = sy+(ey-sy)*t;
        const jx = (hash01(gx,gy,k+9)-0.5)*PATH_W*0.5;
        const jy = (hash01(gx,gy,k+21)-0.5)*PATH_W*0.32;
        const rr = 1.6 + hash01(gx,gy,k+3)*1.4;
        ctx.fillStyle = PATH_SPECKLE;
        ctx.beginPath(); ctx.ellipse(px+jx,py+jy,rr,rr,0,0,7); ctx.fill();
      }
    }

    // trees / bushes at cell CORNERS (the point shared by 4 cells) -- always
    // at least half a grid unit from any path segment's centreline, so they
    // never land on top of the path.
    for (let gy=0; gy<rows-1; gy++) for (let gx=0; gx<cols-1; gx++){
      const i00=gy*cols+gx, i10=i00+1, i01=i00+cols, i11=i01+1;
      if (!(visSet.has(i00) && visSet.has(i10) && visSet.has(i01) && visSet.has(i11))) continue;
      const cx=gx+0.5, cy=gy+0.5;
      if (hash01(cx,cy,31) >= 0.16) continue;
      const [x,y] = project(cx,cy,HEIGHT);
      const k = 0.85 + hash01(cx,cy,61)*0.3;
      if (hash01(cx,cy,21) > 0.5) bushAt(x,y,k); else treeAt(x,y,k);
    }

    for (const [i,col] of [[level.start,START_COL],[level.end,END_COL]]){
      const gx = i%level.cols, gy=(i/level.cols)|0;
      const b = brightnessOf(gx,gy,pgx,pgy);
      if (b <= 0.02) continue;
      const [x,y] = project(gx,gy,HEIGHT);
      const r = W_*0.5;
      ctx.fillStyle = shade(col,-0.35);
      ctx.beginPath(); ctx.ellipse(x,y-r*0.3,r,r*1.0,0,0,7); ctx.fill();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(x,y-r*0.5,r*0.8,r*0.95,0,0,7); ctx.fill();
    }
    drawThread(now);
    const [px,py] = project(pgx,pgy,HEIGHT);
    if (pingAt >= 0) tapPing(pingX, pingY, now);
    playerAt(px,py,now);
  }

  function updateCamera(){
    const now = performance.now();
    const [pgx,pgy] = playerFloatPos(now);
    const [tx,ty] = projectRaw(pgx,pgy,HEIGHT);
    camX += (tx-camX)*0.20;
    camY += (ty-camY)*0.20;
  }

  // ---- drag-to-walk: candidates are "advance into new ground" or "retreat to the
  // previous cell" only -- ported from index.html's chooseTip -- scored by which
  // direction the pointer is most pulling toward from the head.
  let dragActive=false, dragMoved=false, downSX=0, downSY=0, lastPointerSX=0, lastPointerSY=0;
  const DRAG_THRESH = 10;
  function chooseDragDir(){
    if (moving || !level.cols) return null;
    const [hgx,hgy] = headGrid();
    const wx = (lastPointerSX - viewW/2) + camX;
    const wy = (lastPointerSY - viewH/2) + camY;
    const [ox,oy] = projectRaw(hgx,hgy,HEIGHT);
    const dx = wx-ox, dy = wy-oy, dlen = Math.hypot(dx,dy);
    if (dlen < TILE*0.4) return null;
    const head = headCell();
    const prev = trail.length > 1 ? trail[trail.length-2] : -1;
    const cands = [];
    for (const n of openNeighbors(level.cells, level.cols, level.rows, head)) if (!inTrail.has(n)) cands.push(n);
    if (prev >= 0) cands.push(prev);
    if (!cands.length) return null;
    let best=null, bestScore=-2;
    for (const n of cands){
      const ngx = n%level.cols, ngy=(n/level.cols)|0;
      const [nx,ny] = projectRaw(ngx,ngy,HEIGHT);
      const ex = nx-ox, ey = ny-oy, el = Math.hypot(ex,ey)||1;
      const align = (dx*ex+dy*ey)/(dlen*el);
      if (align > bestScore){ bestScore = align; best = [ngx-hgx, ngy-hgy]; }
    }
    if (bestScore < 0.35) return null;
    return best;
  }

  // tap-to-walk, ported from index.html's bfsPath: tapping your own thread retraces
  // directly to that point; otherwise route only through already-revealed ground,
  // and never cross the existing thread (so looping corridors never knot the line).
  function routeToTap(toI){
    if (inTrail.has(toI)){
      const k = trail.indexOf(toI);
      return k < 0 ? null : trail.slice(k, trail.length-1).reverse();
    }
    if (!revealed.has(toI)) return null;   // can't tap through the fog
    const fromI = headCell();
    const prev = new Int32Array(level.cols*level.rows).fill(-1);
    const seen = new Uint8Array(level.cols*level.rows);
    seen[fromI] = 1; const q=[fromI];
    for (let qi=0; qi<q.length; qi++){
      const i=q[qi]; if (i===toI) break;
      for (const n of openNeighbors(level.cells, level.cols, level.rows, i)){
        if (!revealed.has(n) || seen[n]) continue;
        if (inTrail.has(n) && n !== toI) continue;
        seen[n]=1; prev[n]=i; q.push(n);
      }
    }
    if (!seen[toI]) return null;
    const path=[]; let cur=toI;
    while (cur!==fromI){ path.push(cur); cur=prev[cur]; }
    path.reverse();
    return path;
  }

  let pingAt = -1000, pingX=0, pingY=0;

  function tick(ts){
    const now = performance.now();
    finishMoveIfDone(now);
    if (!won){
      if (!moving){
        if (dragActive && dragMoved){
          const d = chooseDragDir();
          if (d) attemptMove(d[0], d[1]);
        } else if (walkQueue.length){
          const nextI = walkQueue.shift();
          const [hgx,hgy] = headGrid();
          const tgx = nextI % level.cols, tgy = (nextI/level.cols)|0;
          attemptMove(tgx-hgx, tgy-hgy);
        }
      }
    }
    updateReveal(...playerFloatPos(now));
    updateCamera();
    draw(now);
    requestAnimationFrame(tick);
  }

  // ---- input ----
  const KEYMAP = {
    ArrowUp:[0,-1], w:[0,-1], W:[0,-1],
    ArrowDown:[0,1], s:[0,1], S:[0,1],
    ArrowLeft:[-1,0], a:[-1,0], A:[-1,0],
    ArrowRight:[1,0], d:[1,0], D:[1,0],
  };
  window.addEventListener('keydown', e=>{
    const dir = KEYMAP[e.key];
    if (!dir) return;
    e.preventDefault();
    tryMove(dir[0], dir[1]);
  });
  function wireDpad(id,dx,dy){
    document.getElementById(id).addEventListener('pointerdown', e=>{ e.preventDefault(); tryMove(dx,dy); });
  }
  wireDpad('dU',0,-1); wireDpad('dD',0,1); wireDpad('dL',-1,0); wireDpad('dR',1,0);

  // pointerdown/pointermove convert to canvas-local coordinates immediately
  // (subtracting the canvas's own getBoundingClientRect() offset), since the
  // canvas no longer sits flush at the browser window's (0,0) now that it's
  // inside a centred phone frame -- everything downstream (chooseDragDir,
  // the drag-threshold check) assumes lastPointerSX/downSX etc. are already
  // in that same canvas-local space that project()/viewW/viewH use.
  cv.addEventListener('pointerdown', e=>{
    if (won) return;
    cv.setPointerCapture(e.pointerId);
    cv.classList.add('dragging');
    const rect = cv.getBoundingClientRect();
    downSX = e.clientX - rect.left; downSY = e.clientY - rect.top;
    lastPointerSX = downSX; lastPointerSY = downSY;
    dragActive = true; dragMoved = false;
    walkQueue.length = 0;   // a new touch cancels any auto-walk in progress
  });
  cv.addEventListener('pointermove', e=>{
    if (!dragActive) return;
    const rect = cv.getBoundingClientRect();
    lastPointerSX = e.clientX - rect.left; lastPointerSY = e.clientY - rect.top;
    if (!dragMoved && Math.hypot(lastPointerSX-downSX, lastPointerSY-downSY) > DRAG_THRESH){
      dragMoved = true;
    }
  });
  function endDrag(e){
    if (!dragActive) return;
    cv.classList.remove('dragging');
    if (!won && !dragMoved && level.cols){
      const [gx,gy] = screenToGrid(e.clientX, e.clientY);
      const rgx = Math.round(gx), rgy = Math.round(gy);
      if (rgx>=0 && rgy>=0 && rgx<level.cols && rgy<level.rows){
        const toI = rgy*level.cols+rgx;
        const path = routeToTap(toI);
        if (path && path.length){
          walkQueue = path;
          pingAt = performance.now();
          const [px,py] = project(rgx,rgy,HEIGHT);
          pingX = px; pingY = py;
        }
      }
    }
    dragActive = false; dragMoved = false;
  }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  let seed = 1;
  document.getElementById('newSeed').addEventListener('click', ()=>{
    seed = (seed*2654435761 + 1) >>> 0;
    buildLevel(levelIdx, seed);
  });
  document.getElementById('lvlDown').addEventListener('click', ()=>{
    levelIdx = Math.max(0, levelIdx-1);
    document.getElementById('lvlLabel').textContent = 'level ' + (levelIdx+1);
    buildLevel(levelIdx, seed);
  });
  document.getElementById('lvlUp').addEventListener('click', ()=>{
    levelIdx = Math.min(TOTAL-1, levelIdx+1);
    document.getElementById('lvlLabel').textContent = 'level ' + (levelIdx+1);
    buildLevel(levelIdx, seed);
  });
  document.getElementById('lightRange').addEventListener('input', e=>{
    nearRadius = parseFloat(e.target.value);
    document.getElementById('lightVal').textContent = nearRadius.toFixed(1);
  });
  document.getElementById('winReplay').addEventListener('click', ()=>{ buildLevel(levelIdx, seed); });
  document.getElementById('winNew').addEventListener('click', ()=>{
    seed = (seed*2654435761 + 1) >>> 0;
    buildLevel(levelIdx, seed);
  });

  document.getElementById('lvlLabel').textContent = 'level ' + (levelIdx+1);
  resize();
  buildLevel(levelIdx, seed);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
